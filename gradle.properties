# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Never auto-download a JDK toolchain over the network (see jvmToolchain(17)
# in app/build.gradle.kts) - only use a JDK 17 Gradle can already find
# locally (JAVA_HOME, ~/.jdks, Android Studio's bundled JBR, etc.). Keeps
# the build usable behind proxies/VPNs that break TLS to api.foojay.io.
org.gradle.java.installations.auto-download=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
